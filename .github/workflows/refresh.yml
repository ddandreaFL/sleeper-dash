name: refresh sleeper snapshot

on:
  schedule:
    # 11:00 UTC daily (7am ET) and 22:00 UTC (6pm ET, before tipoff)
    - cron: "0 11 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build snapshot
        run: python refresh.py --user "${{ vars.SLEEPER_USER }}" --sport all

      - name: Write job summary
        run: python summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git diff --staged --quiet || git commit -m "refresh snapshot [skip ci]"
          git push
